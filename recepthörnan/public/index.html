<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReceptHörnan</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <div class="hero">
            <img class="logo" src="assets/images/LogoBlack.svg" alt="">
            <h1>Låt dig inspireras, dela dina recept<br>och hitta nya favoriter varje dag</h1>
        </div>
        <div id="login">
            <form action="submit">
                <h1>Logga in</h1>
                <input name="logInUsername" type="text" placeholder="Användarnamn">
                <input name="logInPassword" type="password" placeholder="Lösenord">
                <button id="loginButton">Logga in</button>
                <a href="#">Glömt lösenordet?</a>
            </form>
            <button id="createUser">Skapa konto</button>
        </div>
    </main>
    <footer>
        <img class="logo" src="assets/images/LogoBlack.svg" alt="logo">
        <div id="copyright">
            <p>Copyright © 2026 ReceptHörnan. All rights reserved.</p>
            <p>Created by Alfons Forssell</p>
        </div>
    </footer>
</body>

</html>
