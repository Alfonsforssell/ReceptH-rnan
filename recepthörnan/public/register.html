<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReceptHörnan</title>
    <link rel="stylesheet" href="css/register.css">
</head>

<body>
    <main>
        <div class="hero">
            <img class="logo" src="assets/images/LogoBlack.svg" alt="">
            <h1>Låt dig inspireras, dela dina recept<br>och hitta nya favoriter varje dag</h1>
        </div>
        <div id="signUp">
            <form action="">
                <h1>Skapa Konto</h1>
                <input name="signUpMail" type="text" placeholder="Mail" required>
                <input name="signUpUsername" type="text" placeholder="Användarnamn" required>
                <input name="signUpPassword" type="password" placeholder="Lösenord" required>
                <input name="signUpRepeatPassword" type="password" placeholder="Upprepa lösenordet" required>
                <span id="signUpError"></span>
                <button id="signUpButton">Skapa konto</button>
                <a href="/login">Har du redan konto?</a>
            </form>
        </div>
    </main>
    <footer>
        <img class="logo" src="assets/images/LogoBlack.svg" alt="logo">
        <div id="copyright">
            <p>Copyright © 2026 ReceptHörnan. All rights reserved.</p>
            <p>Created by Alfons Forssell</p>
        </div>
    </footer>
    <script type="module" src="js/register.js"></script>
</body>

</html>
